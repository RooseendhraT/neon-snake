<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <title>Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --page: #090d12;
      --panel: #10171f;
      --panel-border: #202b36;
      --text: #edf4f7;
      --muted: #85939f;
      --lime: #a7ff55;
      --cyan: #51e5dd;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px 24px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 5%, rgba(46, 77, 88, .18), transparent 48%),
        var(--page);
      font-size: 15px;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 760px);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 2px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(167, 255, 85, .27);
      border-radius: 11px;
      color: var(--lime);
      background: rgba(167, 255, 85, .08);
      box-shadow: 0 0 22px rgba(167, 255, 85, .08);
    }

    .brand-mark svg { width: 20px; height: 20px; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.035em; }
    .eyebrow { margin-top: 3px; color: var(--muted); font-size: 12px; letter-spacing: .04em; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      color: #b7c3ca;
      background: rgba(16, 23, 31, .8);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 9px rgba(167, 255, 85, .8);
    }

    .scorebar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-height: 64px;
      padding: 11px 15px;
      border: 1px solid var(--panel-border);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(18, 27, 36, .96), rgba(13, 19, 26, .96));
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .stat-value {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .stat-value small { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0; }
    #score { color: var(--lime); }

    .board-shell {
      position: relative;
      overflow: hidden;
      padding: 10px;
      border: 1px solid #283540;
      border-radius: 17px;
      background: #0b1117;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .025);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      background: #0b1218;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: 10px;
      background: rgba(5, 10, 14, .58);
      backdrop-filter: blur(4px);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay.hidden { visibility: hidden; opacity: 0; pointer-events: none; }

    .dialog {
      width: min(100%, 330px);
      padding: 27px 25px 24px;
      border: 1px solid rgba(129, 154, 168, .23);
      border-radius: 17px;
      background: rgba(14, 21, 28, .94);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .38);
    }

    .dialog-icon {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border: 1px solid rgba(167, 255, 85, .24);
      border-radius: 14px;
      color: var(--lime);
      background: rgba(167, 255, 85, .08);
      font-size: 22px;
    }

    .dialog h2 { margin: 0; font-size: 22px; letter-spacing: -.04em; }
    .dialog p { margin: 8px 0 20px; color: #9aa8b2; font-size: 14px; line-height: 1.55; }

    .primary {
      width: 100%;
      min-height: 43px;
      border: 0;
      border-radius: 10px;
      color: #10200a;
      background: var(--lime);
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .primary:active { transform: translateY(0); }
    button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .below {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 13px 3px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .keys { display: flex; align-items: center; gap: 5px; }
    kbd {
      min-width: 23px;
      padding: 3px 6px;
      border: 1px solid #2a3742;
      border-radius: 5px;
      color: #c5d0d7;
      background: #121a22;
      font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
      text-align: center;
      box-shadow: 0 1px 0 #25313a;
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 40px);
      gap: 5px;
      justify-content: center;
      margin-top: 16px;
      touch-action: none;
    }

    .mobile-controls button {
      border: 1px solid #2a3742;
      border-radius: 10px;
      color: #d5e0e5;
      background: #121a22;
      font-size: 17px;
      cursor: pointer;
    }

    .mobile-controls button[data-dir="up"] { grid-column: 2; grid-row: 1; }
    .mobile-controls button[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .mobile-controls button[data-dir="down"] { grid-column: 2; grid-row: 2; }
    .mobile-controls button[data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (max-width: 560px) {
      body { padding: 24px 13px; }
      .topline { margin-bottom: 14px; }
      .scorebar { gap: 7px; }
      .stat { min-height: 59px; padding: 9px 10px; }
      .stat-value { font-size: 20px; }
      .board-shell { padding: 7px; border-radius: 13px; }
      .overlay { inset: 7px; }
      .below { align-items: flex-start; flex-direction: column; gap: 10px; }
      .mobile-controls { display: grid; }
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --page: #eef2f4;
        --panel: #f8fafb;
        --panel-border: #d3dce1;
        --text: #15212a;
        --muted: #647581;
      }
      body { background: radial-gradient(ellipse at 50% 5%, rgba(81, 229, 221, .12), transparent 48%), var(--page); }
      .status-pill, .stat { background: rgba(248, 250, 251, .92); }
      .stat { background: linear-gradient(145deg, #fff, #f3f7f8); }
      .below { color: #647581; }
      kbd, .mobile-controls button { color: #344650; background: #f8fafb; border-color: #d3dce1; box-shadow: 0 1px 0 #d3dce1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 8h6a3 3 0 1 1 0 6H9a3 3 0 1 0 0 6h6a3 3 0 1 0 0-6h-2" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
            <circle cx="17" cy="5" r="2" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>Neon Snake</h1>
          <div class="eyebrow">ARCADE MODE <span aria-hidden="true">·</span> CLASSIC RULES</div>
        </div>
      </div>
      <div class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">Ready to play</span></div>
    </header>

    <section class="scorebar" aria-label="Game stats">
      <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
      <div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
      <div class="stat"><div class="stat-label">Speed</div><div class="stat-value"><span id="speed">1.0</span><small>×</small></div></div>
    </section>

    <section class="board-shell" aria-label="Snake game board">
      <canvas id="game" aria-label="Snake game. Use arrow keys or WASD to move."></canvas>
      <div class="overlay" id="overlay">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMessage">
          <div class="dialog-icon" id="dialogIcon" aria-hidden="true">↗</div>
          <h2 id="dialogTitle">Ready when you are</h2>
          <p id="dialogMessage">Collect the glowing orbs. Don't run into yourself or the edge.</p>
          <button class="primary" id="startButton">Start game <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <div class="below">
      <div class="keys"><span>Move</span> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span>or WASD</span><span style="margin-left:8px">Pause</span><kbd>Space</kbd></div>
      <span>Every orb makes you a little quicker.</span>
    </div>
    <div class="mobile-controls" aria-label="Touch controls">
      <button type="button" data-dir="up" aria-label="Move up">↑</button>
      <button type="button" data-dir="left" aria-label="Move left">←</button>
      <button type="button" data-dir="down" aria-label="Move down">↓</button>
      <button type="button" data-dir="right" aria-label="Move right">→</button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const title = document.querySelector("#dialogTitle");
      const message = document.querySelector("#dialogMessage");
      const startButton = document.querySelector("#startButton");
      const statusText = document.querySelector("#statusText");
      const statusDot = document.querySelector("#statusDot");
      const scoreText = document.querySelector("#score");
      const bestText = document.querySelector("#best");
      const speedText = document.querySelector("#speed");

      const columns = 32;
      const rows = 24;
      const initialInterval = 145;
      const snakeColor = "#a7ff55";
      const foodColor = "#51e5dd";
      let snake;
      let food;
      let direction;
      let queuedDirection;
      let score = 0;
      let best = readBest();
      let interval = initialInterval;
      let running = false;
      let paused = false;
      let lastFrame = 0;
      let accumulator = 0;
      let foodPulse = 0;
      let animationFrame = 0;

      bestText.textContent = best;

      function readBest() {
        try {
          return Number(localStorage.getItem("neon-snake-best")) || 0;
        } catch {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem("neon-snake-best", String(best));
        } catch {
          // The game remains playable when storage is unavailable.
        }
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function reset() {
        const centerX = Math.floor(columns / 2);
        const centerY = Math.floor(rows / 2);
        snake = [
          { x: centerX, y: centerY },
          { x: centerX - 1, y: centerY },
          { x: centerX - 2, y: centerY },
          { x: centerX - 3, y: centerY }
        ];
        direction = { x: 1, y: 0 };
        queuedDirection = direction;
        score = 0;
        interval = initialInterval;
        scoreText.textContent = "0";
        speedText.textContent = "1.0";
        placeFood();
        draw();
      }

      function placeFood() {
        let candidate;
        do {
          candidate = {
            x: Math.floor(Math.random() * columns),
            y: Math.floor(Math.random() * rows)
          };
        } while (snake.some(segment => segment.x === candidate.x && segment.y === candidate.y));
        food = candidate;
      }

      function setStatus(text, active) {
        statusText.textContent = text;
        statusDot.style.background = active ? "var(--lime)" : "#74818b";
        statusDot.style.boxShadow = active ? "0 0 9px rgba(167, 255, 85, .8)" : "none";
      }

      function start() {
        reset();
        overlay.classList.add("hidden");
        running = true;
        paused = false;
        accumulator = 0;
        lastFrame = 0;
        setStatus("In motion", true);
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(loop);
      }

      function finish() {
        running = false;
        paused = false;
        setStatus("Game over", false);
        title.textContent = "Game over";
        message.textContent = `You scored ${score} ${score === 1 ? "point" : "points"}. Ready for another run?`;
        startButton.innerHTML = 'Play again <span aria-hidden="true">→</span>';
        overlay.classList.remove("hidden");
        draw();
        startButton.focus({ preventScroll: true });
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        if (paused) {
          setStatus("Paused", false);
          title.textContent = "Taking a breather";
          message.textContent = "Your run is paused. Pick up right where you left off.";
          startButton.innerHTML = 'Resume game <span aria-hidden="true">→</span>';
          overlay.classList.remove("hidden");
        } else {
          overlay.classList.add("hidden");
          setStatus("In motion", true);
          accumulator = 0;
          lastFrame = 0;
          animationFrame = requestAnimationFrame(loop);
        }
      }

      function loop(timestamp) {
        if (!running || paused) return;
        if (!lastFrame) lastFrame = timestamp;
        accumulator += Math.min(timestamp - lastFrame, 250);
        lastFrame = timestamp;
        foodPulse = timestamp;

        while (accumulator >= interval && running) {
          step();
          accumulator -= interval;
        }
        draw();
        if (running) animationFrame = requestAnimationFrame(loop);
      }

      function step() {
        direction = queuedDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const eating = head.x === food.x && head.y === food.y;
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        if (
          head.x < 0 || head.x >= columns ||
          head.y < 0 || head.y >= rows ||
          bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)
        ) {
          finish();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 10;
          scoreText.textContent = score;
          if (score > best) {
            best = score;
            bestText.textContent = best;
            saveBest();
          }
          interval = Math.max(62, initialInterval - (score / 10) * 6);
          speedText.textContent = (initialInterval / interval).toFixed(1);
          placeFood();
        } else {
          snake.pop();
        }
      }

      function draw() {
        if (!ctx || !canvas.width) return;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const cellW = width / columns;
        const cellH = height / rows;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#0b1218";
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "rgba(152, 183, 194, .065)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= columns; x++) {
          const px = Math.round(x * cellW) + .5;
          ctx.moveTo(px, 0);
          ctx.lineTo(px, height);
        }
        for (let y = 0; y <= rows; y++) {
          const py = Math.round(y * cellH) + .5;
          ctx.moveTo(0, py);
          ctx.lineTo(width, py);
        }
        ctx.stroke();

        if (food) {
          const cx = (food.x + .5) * cellW;
          const cy = (food.y + .5) * cellH;
          const pulse = Math.sin(foodPulse / 180) * .1 + .92;
          const radius = Math.min(cellW, cellH) * .29 * pulse;
          ctx.save();
          ctx.shadowColor = foodColor;
          ctx.shadowBlur = 14;
          ctx.fillStyle = foodColor;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = "rgba(255,255,255,.65)";
          ctx.beginPath();
          ctx.arc(cx - radius * .24, cy - radius * .26, radius * .2, 0, Math.PI * 2);
          ctx.fill();
        }

        if (snake) {
          snake.forEach((segment, index) => {
            const inset = Math.max(1.5, Math.min(cellW, cellH) * .09);
            const x = segment.x * cellW + inset;
            const y = segment.y * cellH + inset;
            const w = cellW - inset * 2;
            const h = cellH - inset * 2;
            const alpha = Math.max(.45, 1 - index / (snake.length * 1.9));
            ctx.fillStyle = index === 0 ? snakeColor : `rgba(139, 239, 72, ${alpha})`;
            if (index === 0) {
              ctx.save();
              ctx.shadowColor = snakeColor;
              ctx.shadowBlur = 12;
            }
            roundedRect(ctx, x, y, w, h, Math.min(5, w * .28));
            ctx.fill();
            if (index === 0) {
              ctx.restore();
              drawEyes(x, y, w, h);
            }
          });
        }
      }

      function roundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.roundRect(x, y, width, height, radius);
      }

      function drawEyes(x, y, width, height) {
        const radius = Math.max(1.15, Math.min(width, height) * .065);
        let points;
        if (direction.x === 1) points = [[x + width * .71, y + height * .32], [x + width * .71, y + height * .68]];
        else if (direction.x === -1) points = [[x + width * .29, y + height * .32], [x + width * .29, y + height * .68]];
        else if (direction.y === -1) points = [[x + width * .32, y + height * .29], [x + width * .68, y + height * .29]];
        else points = [[x + width * .32, y + height * .71], [x + width * .68, y + height * .71]];
        ctx.fillStyle = "#17300e";
        for (const [eyeX, eyeY] of points) {
          ctx.beginPath();
          ctx.arc(eyeX, eyeY, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function changeDirection(next) {
        if (!running || paused) return;
        if (next.x === -direction.x && next.y === -direction.y) return;
        queuedDirection = next;
      }

      document.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();
        const directions = {
          arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
          arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
          arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
          arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
        };
        if (directions[key]) {
          event.preventDefault();
          changeDirection(directions[key]);
        } else if (key === " " || key === "escape") {
          event.preventDefault();
          if (running) togglePause();
          else if (!overlay.classList.contains("hidden")) start();
        } else if (key === "enter" && !running && !paused) {
          start();
        }
      });

      document.querySelectorAll(".mobile-controls button").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          const moves = {
            up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
            left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
          };
          changeDirection(moves[button.dataset.dir]);
        });
      });

      startButton.addEventListener("click", () => {
        if (paused) togglePause();
        else {
          title.textContent = "Ready when you are";
          message.textContent = "Collect the glowing orbs. Don't run into yourself or the edge.";
          start();
        }
      });

      const resizeObserver = new ResizeObserver(resizeCanvas);
      resizeObserver.observe(canvas);
      reset();
      resizeCanvas();
    })();
  </script>
</body>
</html>
